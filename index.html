<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="./5605921.png" type="image/x-icon">
    <title> SwiftCount </title>
</head>
<body>
    <div class="container">
        <div class="container-content">
            <h1> SwiftCount  </h1>
            <div class="view-count">
                <p class="p-count"> Present value </p>
                <span class="count" id="count"> 0 </span>
            </div>
            <div class="btn-count">
                <button class="btn btn-plus" onclick="increment()"> <i class="fa-solid fa-plus"></i> </button>
                <button class="btn btn-reset" onclick="reset()"> <i class="fa-solid fa-repeat"></i> </button>
                <button class="btn btn-manus" onclick="dincrement()"> <i class="fa-solid fa-minus"></i> </button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
    <script src="https://kit.fontawesome.com/c3d5b4a9ba.js" crossorigin="anonymous"></script>
</body>
</html>
